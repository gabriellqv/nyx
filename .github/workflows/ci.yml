name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Code Quality and Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nyx_user
          POSTGRES_PASSWORD: nyx_password
          POSTGRES_DB: nyx_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://nyx_user:nyx_password@localhost:5433/nyx_test?schema=public

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Run Gitleaks secret detection
        uses: gitleaks/gitleaks-action@v2
        if: ${{ !env.ACT }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check formatting with Prettier
        run: pnpm format:check

      - name: Run ESLint
        run: pnpm lint

      - name: Validate Prisma schema
        run: pnpm --filter @nyx/api exec prisma validate

      - name: Validate production Compose configuration
        run: |
          export POSTGRES_PASSWORD="$(openssl rand -hex 16)"
          export DATABASE_URL="postgresql://nyx_prod_user:${POSTGRES_PASSWORD}@postgres:5432/nyx_prod?schema=public"
          export JWT_SECRET="$(openssl rand -hex 32)"
          export WEBHOOK_SECRET_ENCRYPTION_KEY="$(openssl rand -hex 32)"
          docker compose -f docker-compose.prod.yml config --quiet

      - name: Generate Prisma client
        run: pnpm --filter @nyx/api exec prisma generate

      - name: Run Prisma migrations
        run: pnpm --filter @nyx/api exec prisma migrate deploy

      - name: Install PostgreSQL client tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Verify database backup and restore
        run: ./infrastructure/scripts/test-backup-restore.sh
        env:
          DB_HOST: localhost
          DB_PORT: 5433
          DB_USER: nyx_user
          DB_PASSWORD: nyx_password
          DB_NAME: nyx_test

      - name: Build shared packages
        run: pnpm --filter @nyx/contracts build

      - name: Run typecheck across monorepo
        run: pnpm typecheck

      - name: Run test suite
        run: pnpm test
        env:
          NODE_ENV: test

      - name: Build applications
        run: pnpm build
        env:
          NODE_ENV: production
